name: CI - Node TypeScript minimal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  notify:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify (SLACK_WEBHOOK optional)
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          STATUS: ${{ needs.build-and-test.result }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No SLACK_WEBHOOK secret; skipping notification."
            exit 0
          fi
          PAYLOAD="{\"text\":\"CI ${STATUS} — ${GITHUB_REPOSITORY} — ${GITHUB_REF} — run ${GITHUB_RUN_NUMBER}\"}"
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK"