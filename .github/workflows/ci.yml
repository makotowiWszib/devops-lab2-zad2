name: CI - Node TypeScript

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist

      - name: Notify on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL not set - skipping notification"
            exit 0
          fi
          PAYLOAD="{\"text\":\"CI FAILED: repo=${GITHUB_REPOSITORY} ref=${GITHUB_REF} run=${GITHUB_RUN_NUMBER} matrix_node=${{ matrix.node-version }}\"}"
          # dla Slack/Discord/Teams zmień strukturę payload jeśli potrzeba
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL"
